# Gitleaks configuration for CodeScaleBench.
#
# Extends the default ruleset. The allowlist below suppresses structural
# false positives so a real finding stands out:
#   - Sourcegraph's access-token rule matches any 40-char hex, which collides
#     with git commit SHAs. The benchmark repo-pinning data and the scripts
#     that record pinned commits are full of SHAs — not tokens.
#   - Benchmark task content embeds test RSA keys and sample provider keys as
#     fixtures (e.g. the flipt ECR-auth task).
#   - Result traces under docs/official_results/ are scrubbed by
#     scripts/maintenance/sanitize_secrets.py before export; that is the secret
#     control for trace data, not gitleaks.
# Code and config outside these paths are still fully scanned.

title = "CodeScaleBench"

[extend]
useDefault = true

[allowlist]
description = "Benchmark fixtures, repo-pinning commit SHAs, and sanitized result traces"
paths = [
  '''benchmarks/.*''',
  '''docs/official_results/.*''',
  '''docs/analysis/compare/.*''',
  '''runs/.*''',
  '''observatory/annotations/.*''',
  '''scripts/evaluation/audit_unpinned_repos\.py''',
  '''base_images/update_task_dockerfiles\.py''',
  '''scripts/maintenance/sanitize_secrets\.py''',
  '''lib/runner/executor\.py''',
  '''skills/_archive/.*''',
]
regexes = [
  # Public "Official Claude Code CLI" OAuth client ID — a published identifier, not a secret.
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',
]
